        el("button", { class: "text-link-btn", onclick: () => { stopLobbyListener(); renderLobby(); } }, backChevronIcon(), "Cambia stanza"),
        el("span", { class: "app-meta" }, `Tock by Mig · ${APP_VERSION} · © 2026 Mig`)
      ),
      homeScreenHint()
    )
  );

  sizeLogoDotsToTitle();
  renderLobbyColorSection(roomId, existingPlayers);

  // Ascolto in tempo reale: prima questa schermata era una fotografia presa
  // una volta sola, quindi se un altro giocatore sceglieva un colore (o gli
  // veniva assegnato un bot) mentre eri ancora qui, non lo vedevi finché non
  // facevi tu stesso un'azione che la ricaricava. Ora si aggiorna da sola,
  // senza toccare il nome che stai eventualmente scrivendo (solo la sezione
  // dei colori viene ridisegnata, vedi renderLobbyColorSection).
  const ref = roomRef(roomId);
  ref.on("value", (snap) => {
    const players = (snap.val() && normalizeState(snap.val()).players) || {};
    renderLobbyColorSection(roomId, players);
  });
  lobbyListenerRef = ref;

  // Poll di riserva (vedi il commento su lobbyPollInterval): rilegge lo
  // stato vero ogni 4s, indipendentemente da .on("value") e dal
  // visibilitychange qui sotto.
  lobbyPollInterval = setInterval(() => {
    if (!lobbyListenerRef) return;
    roomRef(roomId)
      .get()
      .then((snap) => {
        if (!lobbyListenerRef) return; // nel frattempo si è già entrati/cambiata stanza
        const players = (snap.val() && normalizeState(snap.val()).players) || {};
        renderLobbyColorSection(roomId, players);
      })
      .catch(() => {});
  }, 4000);
}

// Rete su mobile o cambio app/schermo bloccato possono far "addormentare"
// momentaneamente l'ascolto realtime di Firebase — se succede proprio
// mentre si è nella lobby di scelta colore, un colore preso da qualcun
// altro nel frattempo può non comparire finché non si torna sulla pagina.
// Difesa aggiuntiva: al ritorno in primo piano, se l'ascolto della lobby è
// ancora attivo, si rilegge una volta lo stato vero da Firebase (non solo
// ci si affida al prossimo evento realtime, che potrebbe essere andato
// perso) e si ridisegna — così un colore preso "durante l'assenza" compare
// comunque appena si riapre l'app, invece di restare disallineato.
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !lobbyListenerRef || !lastColorSectionArgs) return;
  roomRef(lastColorSectionArgs.roomId)
    .get()
    .then((snap) => {
      if (!lobbyListenerRef) return; // nel frattempo si è già entrati/cambiata stanza
      const players = (snap.val() && normalizeState(snap.val()).players) || {};
      renderLobbyColorSection(lastColorSectionArgs.roomId, players);
    })
    .catch(() => {});
});

// Ridisegna SOLO la sezione dei colori (griglia squadre + pulsanti bot) più
// lo stato di "Entra nella stanza", senza toccare il resto della card —
// così un aggiornamento in tempo reale non cancella mai il nome che stai
// scrivendo nel campo sopra. Chiamata sia al primo render sia da ogni
// tick dell'ascolto Firebase in renderManualLobby.
let lastColorSectionArgs = null;
function renderLobbyColorSection(roomId, existingPlayers) {
  const wrap = $("#color-row-wrap");
  if (!wrap) return; // non siamo più su questa schermata (es. si è già entrati)
  lastColorSectionArgs = { roomId, existingPlayers };

  // Una selezione già fatta non deve sparire solo perché la schermata si è
  // aggiornata (da un'azione tua su un bot, o ora anche da un altro
  // giocatore) — si azzera solo se quel colore è stato davvero preso.
  if (myColor && existingPlayers && existingPlayers[myColor]) myColor = null;

  // Le pedine sono raggruppate per squadra (TEAM_OF) invece che in una
  // semplice griglia 2x2, con un badge "VS" al centro tra i due gruppi. I
  // colori già presi da un altro giocatore in questa stanza sono disabilitati
  // e mostrano CHI li ha presi (nome, o "computer") invece di un generico
  // "(preso)" che non diceva nulla su chi ci fosse già dentro.
  const takenColors = new Set(Object.keys(existingPlayers || {}));
  const checkmark = () =>
    el(
      "span",
      { class: "color-card-check" },
      svgIcon(12, 12, "0 0 24 24", "#FFFFFF", 3.2, [["polyline", { points: "20 6 9 17 4 12" }]])
    );
  // Il "corpo" cliccabile del riquadro: pallino + nome/etichetta. Preso da un
  // altro giocatore -> nome (o "computer") e colore come sottotitolo; è il
  // tuo colore già scelto (ma non ancora confermato, vedi joinManualRoom) ->
  // il tuo nome (se scritto) e un segno di spunta; libero -> solo "Libero",
  // i pulsanti bot stanno sotto nello stesso riquadro.
  const colorBtn = (c) => {
    const occupant = existingPlayers && existingPlayers[c];
    const mine = !occupant && myColor === c;
    let inner;
    if (occupant) {
      inner = [
        el("span", { class: "color-card-dot" }),
        el("div", { class: "color-card-name" }, (occupant.isBot ? "🤖 " : "") + (occupant.name || colorLabel(c))),
        el("div", { class: "color-card-sub" }, colorLabel(c)),
      ];
    } else if (mine) {
      const myDisplayName = ($("#name-input") && $("#name-input").value.trim()) || myName || "Tu";
      inner = [
        checkmark(),
        el("span", { class: "color-card-dot" }),
        el("div", { class: "color-card-name" }, myDisplayName),
        el("div", { class: "color-card-sub" }, `${colorLabel(c)} · tu`),
      ];
    } else {
      inner = [el("span", { class: "color-card-dot" }), el("div", { class: "color-card-free-label" }, "Libero")];
    }
    return el(
      "button",
      { class: "color-btn color-" + c, onclick: () => selectColor(c), "data-color": c, disabled: takenColors.has(c) },
      inner
    );
  };
  // Ogni posto libero può anche essere affidato al computer invece che a
  // una persona — comodo per provare/giocare quando non siete in 4. Un
  // posto già assegnato al computer si può anche liberare di nuovo (mai un
  // posto occupato da una persona vera). onDone è un no-op: l'ascolto
  // realtime già attivo su questa schermata si occupa da solo di
  // ridisegnare non appena Firebase conferma la scrittura.
  const botCell = (c) => {
    const taken = existingPlayers && existingPlayers[c];
    if (!taken && myColor === c) return ""; // è il colore che hai appena scelto tu, niente pulsanti bot
    if (!taken) {
      return el(
        "div",
        { class: "bot-cell-assign" },
        el("div", { class: "bot-assign-label" }, "Assegna al computer:"),
        el(
          "div",
          { class: "bot-btn-row" },
          el("button", { class: "bot-btn", onclick: () => assignBotToColor(roomId, c, () => {}, "easy") }, "🤖 Normale"),
          el("button", { class: "bot-btn", onclick: () => assignBotToColor(roomId, c, () => {}, "hard") }, "🤖 Difficile")
        )
      );
    }
    if (taken.isBot) {
      const lv = taken.botLevel === "easy" ? "normale" : "difficile";
      return el(
        "button",
        { class: "bot-btn bot-btn-remove", onclick: () => removeBotFromColor(roomId, c, () => {}) },
        `🤖 Libera posto (${lv})`
      );
    }
    return "";
  };
  // Il riquadro intero (.color-cell) porta ora bordo/sfondo/posizione dello
  // stato (preso/tuo/libero) — prima erano due blocchi separati (bottone +
  // div sotto) invece di un'unica card come nel mockup.
  const colorCell = (c) => {
    const occupant = existingPlayers && existingPlayers[c];
    const state = occupant ? "cc-taken" : myColor === c ? "cc-mine" : "cc-free";
    return el("div", { class: `color-cell cc-${c} ${state}` }, colorBtn(c), botCell(c));
  };
  // COLORS è già nell'ordine giusto per riempire la griglia 2x2 riga per
  // riga (rosso+verde sulla prima riga, giallo+blu sulla seconda) — vedi il
  // commento su .teams-grid per il perché di una griglia unica.
  wrap.innerHTML = "";
  wrap.appendChild(
    el(
      "div",
      { class: "teams-grid" },
      el("div", { class: "team-thread team-thread-a" }),
      el("div", { class: "team-thread team-thread-b" }),
      COLORS.map(colorCell),
      el("div", { class: "vs-badge" }, el("span", {}, "VS"))
    )
  );

  const joinBtn = $("#join-btn");
  if (joinBtn) joinBtn.disabled = !myColor;
  const hint = $("#join-hint");
  if (hint) hint.style.display = myColor ? "none" : "";
}

// Riconosce il sistema dal browser (iOS/iPadOS vs Android vs altro) per
// mostrare istruzioni di installazione corrette: i passaggi per
// "aggiungere a Home" sono diversi tra Safari (iPhone/iPad) e Chrome
// (Android), quindi un testo unico era fuorviante su metà dei telefoni.
function detectPlatform() {
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isIOS) return "ios";
  if (/Android/.test(ua)) return "android";
  return "other";
}

// True se il gioco è già stato aperto come app installata (standalone) —
// in tal caso il suggerimento non serve più.
function isStandaloneDisplay() {
  return (
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
    window.navigator.standalone === true
  );
}

function homeScreenHint() {
  if (localStorage.getItem("tock-hide-a2hs") === "1") return "";
  if (isStandaloneDisplay()) return "";
  const platform = detectPlatform();
  const text =
    platform === "ios"
      ? "💡 Consiglio: tocca l'icona Condividi (il quadratino con la freccia in su) in Safari e scegli \"Aggiungi a Home\" per aprire il gioco a schermo intero come un'app."
      : platform === "android"
      ? "💡 Consiglio: apri il menu ⋮ in alto a destra in Chrome e scegli \"Installa app\" (o \"Aggiungi a schermata Home\") per aprire il gioco a schermo intero come un'app."
      : "💡 Consiglio: usa la funzione \"Aggiungi a schermata Home\" del tuo browser per aprire il gioco a schermo intero come un'app.";
  const box = el(
    "div",
    { class: "a2hs-hint" },
    el("span", {}, text),
    el("button", { class: "a2hs-close", onclick: (e) => { localStorage.setItem("tock-hide-a2hs", "1"); e.target.closest(".a2hs-hint").remove(); } }, "✕")
  );
  return box;
}

function colorLabel(c) {
  return { red: "Rosso", green: "Verde", yellow: "Giallo", blue: "Blu" }[c];
}
function colorEmoji(c) {
  return { red: "🔴", green: "🟢", yellow: "🟡", blue: "🔵" }[c];
}

// A small colored circle matching the game's own palette exactly — used
// instead of a 🔴🟢🟡🔵 emoji wherever a color needs to be shown inline,
// since emoji circles have a fixed color baked in by the platform and
// never quite match our custom hex values.
function swatchDot(color) {
  return el("span", { class: "swatch swatch-" + color, style: "margin: 0 4px -2px 2px;" });
}

// Prefer the name the player chose when joining; fall back to the plain
// color label if none was set (e.g. an older game, or left blank).
function playerName(state, c) {
  const p = state && state.players && state.players[c];
  const n = p && p.name;
  // Un bot ha già un nome vero (es. "Guglielmo", vedi pickBotName) invece
  // di un generico "Bot <Colore>", quindi si distingue da solo un bot
  // dall'altro qui senza bisogno di appendere altro.
  return n && n.trim() ? n.trim() : colorLabel(c);
}

function selectColor(c) {
  myColor = c;
  // Ridisegna l'intera sezione colori invece di limitarsi a spostare la
  // classe "selected" — ora serve perché il riquadro scelto mostra anche il
  // segno di spunta e il tuo nome, non solo un bordo diverso.
  if (lastColorSectionArgs) {
    renderLobbyColorSection(lastColorSectionArgs.roomId, lastColorSectionArgs.existingPlayers);
  } else {
    const joinBtn = document.getElementById("join-btn");
    if (joinBtn) joinBtn.disabled = false;
    const hint = document.getElementById("join-hint");
    if (hint) hint.style.display = "none";
  }
}

async function joinManualRoom(roomId) {
  unlockAudio();
  const name = $("#name-input").value.trim();
  if (!myColor) return showToast("Scegli un colore.");
  myRoomId = roomId;
  myName = name || colorLabel(myColor);

  // FONDAMENTALE: va staccato PRIMA di scrivere su Firebase, non dopo.
  // L'ascolto in tempo reale della lobby (aggiunto in v3.4) reagisce anche
  // alla nostra STESSA scrittura qui sotto — la vede arrivare come "questo
  // colore è stato preso" e azzerava myColor proprio mentre stavamo
  // entrando (bug: "Sei: Giuliano (undefined) · squadra undefined").
  // Staccarlo subito, prima dello scrivere, elimina la corsa critica.
  stopLobbyListener();

  const ref = roomRef(roomId);
  const claimToken = getOrCreateClaimToken(roomId, myColor);

  // Tutto dentro UNA transazione (leggi-controlla-scrivi atomico), non più
  // un get() seguito da un set() separato: quel prima/dopo lasciava una
  // finestra in cui due telefoni potevano leggere "colore libero"
  // entrambi PRIMA che uno dei due avesse scritto, e finire entrambi nello
  // stesso colore (bug segnalato). Stesso motivo per cui updateState (le
  // mosse in partita) usa già una transazione.
  let blockedReason = null; // {kind:"color", by} | {kind:"name"} | null
  let caughtError = null;
  const result = await ref
    .transaction((current) => {
      blockedReason = null;
      try {
        if (current === null) {
          const players = {};
          players[myColor] = { name: myName, token: claimToken };
          return newGameState(players, "manual");
        }
        const state = normalizeState(JSON.parse(JSON.stringify(current)));
        const existing = state.players && state.players[myColor];
        const sameName = existing && existing.name && myName &&
          existing.name.trim().toLowerCase() === myName.trim().toLowerCase();
        if (existing && existing.token && existing.token !== claimToken && !sameName) {
          blockedReason = { kind: "color", by: existing.name || colorLabel(myColor) };
          return undefined; // annulla il tentativo, non scrivere nulla
        }
        // Due colori diversi con lo stesso nome mandano in confusione il
        // rientro-per-nome più avanti (non saprebbe a quale colore restituire
        // il posto), quindi lo blocchiamo già qui.
        const otherPlayers = state.players || {};
        const nameTakenElsewhere = COLORS.some((c) => {
          if (c === myColor) return false;
          const p = otherPlayers[c];
          return p && p.name && myName && p.name.trim().toLowerCase() === myName.trim().toLowerCase();
        });
        if (nameTakenElsewhere) {
          blockedReason = { kind: "name" };
          return undefined;
        }
        if (!state.players) state.players = {};
        state.players[myColor] = { name: myName, token: claimToken };
        return state;
      } catch (e) {
        caughtError = e;
        return undefined;
      }
    })
    .catch((e) => {
      caughtError = e;
      return null;
    });

  if (blockedReason && blockedReason.kind === "color") {
    showToast(`Il colore ${colorLabel(myColor)} è già stato scelto da ${blockedReason.by} in questa stanza. Scegline un altro, oppure rientra usando esattamente lo stesso nome per riprenderlo.`);
    return;
  }
  if (blockedReason && blockedReason.kind === "name") {
    showToast(`Il nome "${myName}" è già usato da un altro giocatore in questa stanza. Scegline uno diverso (es. aggiungi un'iniziale).`);
    return;
  }
  if (caughtError) {
    console.error("joinManualRoom error:", caughtError);
    showToast("Non è stato possibile entrare nella stanza. Riprova.");
    return;
  }
  if (!result || result.committed === false) {
    showToast("Non è stato possibile entrare nella stanza (richiesta non completata). Riprova.");
    return;
  }

  // (l'ascolto della lobby è già stato staccato in cima alla funzione)
  watchRoom(roomId, onStateChange);
  renderGameShell();
}

// Nomi assegnati ai bot invece di un generico "Bot Verde"/"Computer" — più
// simpatico e, quando ce n'è più di uno in stanza, li distingue subito uno
// dall'altro a colpo d'occhio in chat/registro/lobby (playerName() li usa
// così come sono, senza bisogno di codice speciale altrove).
const BOT_NAMES = [
  "Guglielmo", "Beatrice", "Leonardo", "Chiara", "Filippo", "Sofia",
  "Tommaso", "Martina", "Riccardo", "Elena", "Davide", "Alessia",
  "Lorenzo", "Giulia", "Edoardo", "Caterina", "Matteo", "Camilla",
  "Federico", "Aurora",
];
// Sceglie un nome libero (non già usato da chi è in stanza) così due bot
// non finiscono mai con lo stesso nome; se per assurdo sono finiti tutti
// occupati (più di 20 tra bot e persone) aggiunge un numero in coda invece
// di bloccarsi.
function pickBotName(usedNames) {
  const used = new Set((usedNames || []).filter(Boolean).map((n) => n.trim().toLowerCase()));
  const free = BOT_NAMES.filter((n) => !used.has(n.toLowerCase()));
  if (free.length > 0) return free[Math.floor(Math.random() * free.length)];
  const base = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
  let n = 2;
  while (used.has((base + " " + n).toLowerCase())) n++;
  return base + " " + n;
}

// Affida un posto libero al computer, invece che a una persona — utile per
// provare o giocare anche quando non siete in 4. Se la stanza non esiste
// ancora (nessuno l'ha creata cliccando "Entra nella stanza"), il computer
// può comunque essere il primo occupante: la creiamo qui allo stesso modo.
//
// `onDone`, se passato, sostituisce il ri-render di default (pensato per la
// lobby PRIMA di entrare, dove non c'è ancora un ascoltatore realtime
// attivo). Chiamata invece dalla sala d'attesa DOPO essere entrati — dove
// watchRoom/onStateChange è già in ascolto e si aggiorna da solo — basta
// passare un no-op per evitare di essere rispediti per errore alla
// schermata di scelta colore/nome.
async function assignBotToColor(roomId, color, onDone, botLevel) {
  unlockAudio();
  const level = botLevel === "easy" ? "easy" : "hard"; // default storico: "difficile" (comportamento di sempre)
  try {
    const ref = roomRef(roomId);
    const snap = await ref.get();
    if (!snap.exists()) {
      const players = {};
      players[color] = { name: pickBotName([]), token: "BOT-" + color, isBot: true, botLevel: level };
      const state = newGameState(players, "manual");
      await writeState(roomId, state);
    } else {
      await updateState(roomId, (state) => {
        if (state.players[color]) throw new Error("questo colore è già stato preso");
        const used = COLORS.map((c) => state.players[c] && state.players[c].name);
        state.players[color] = { name: pickBotName(used), token: "BOT-" + color, isBot: true, botLevel: level };
      });
    }
  } catch (e) {
    showToast("Non riesco ad assegnare il computer: " + describeError(e));
    return;
  }
  if (onDone) { onDone(); return; }
  const snap2 = await roomRef(roomId).get();
  renderManualLobby(roomId, (snap2.val() && snap2.val().players) || {});
}

// Libera un posto assegnato al computer (mai un posto occupato da una
// persona vera — il controllo isBot dentro la transazione lo garantisce).
// Stesso discorso di `onDone` sopra.
async function removeBotFromColor(roomId, color, onDone) {
  try {
    await updateState(roomId, (state) => {
      const p = state.players[color];
      if (!p || !p.isBot) return; // non tocca un posto umano
      delete state.players[color];
    });
  } catch (e) {
    showToast("Non riesco a togliere il computer: " + describeError(e));
    return;
  }
  if (onDone) { onDone(); return; }
  const snap = await roomRef(roomId).get();
  renderManualLobby(roomId, (snap.val() && snap.val().players) || {});
}

// Equivalente di assignBotToColor/removeBotFromColor ma per la modalità
// "estrazione" (roomMode "draw"): qui non si sceglie un colore, quindi il
// bot entra come un giocatore qualsiasi nel draft (nome + token) e rientra
// nel sorteggio delle coppie come chiunque altro. Il colore gli viene
// assegnato più avanti da maybeAdvanceDraft/maybeAdvanceDraftBots, esattamente
// come per una persona vera — solo che se finisce su una coppia composta da
// due bot (nessun umano che possa cliccare "scegli il colore" per loro),
// ci pensa maybeAdvanceDraftBots a farlo al posto suo.
async function assignBotToDraft(roomId, botLevel) {
  unlockAudio();
  const level = botLevel === "easy" ? "easy" : "hard";
  try {
    await updateState(roomId, (state) => {
      if (!state.draft) throw new Error("questa stanza non è in modalità estrazione");
      if (Object.keys(state.draft.players).length >= 4) throw new Error("la stanza è già piena (4 giocatori)");
      const token = "bot-" + Math.random().toString(36).slice(2, 8);
      const name = pickBotName(Object.values(state.draft.players));
      state.draft.players[token] = name;
      state.draft.order.push(token);
      if (!state.draft.botTokens) state.draft.botTokens = {};
      state.draft.botTokens[token] = level;
      maybeStartPairDraw(state);
    });
  } catch (e) {
    showToast("Non riesco ad aggiungere il computer: " + describeError(e));
  }
}

// Toglie un bot dall'estrazione prima che la stanza si riempia (dopo, il
// sorteggio è già partito e non ha più senso liberare il posto da qui).
async function removeBotFromDraft(roomId, token) {
  try {
    await updateState(roomId, (state) => {
      if (!state.draft || !state.draft.botTokens || !state.draft.botTokens[token]) return; // non è un bot, non tocca
      delete state.draft.players[token];
      delete state.draft.botTokens[token];
      state.draft.order = state.draft.order.filter((t) => t !== token);
    });
  } catch (e) {
    showToast("Non riesco a togliere il computer: " + describeError(e));
  }
}

// A color, once claimed in a room, stays claimed by the same device/browser
// (matched via a random token saved in localStorage) so it can always be
// rejoined, while a different device trying to grab an already-taken color
// gets blocked instead of silently stealing the seat.
function getOrCreateClaimToken(roomId, color) {
  const key = "tock-claim-" + roomId + "-" + color;
  try {
    let token = localStorage.getItem(key);
    if (!token) {
      token = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(key, token);
    }
    return token;
  } catch (e) {
    // localStorage unavailable (private mode, etc.) — fall back to a
    // fresh token every time, which just means no reconnect protection.
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
}

// A room-scoped (not per-color) token used only during il flusso
// "estrazione", prima che un colore sia assegnato — serve a riconoscere lo
// stesso dispositivo se ricarica la pagina mentre si è ancora in attesa o a
// metà del sorteggio.
function getOrCreateRoomToken(roomId) {
  const key = "tock-roomtoken-" + roomId;
  try {
    let token = localStorage.getItem(key);
    if (!token) {
      token = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(key, token);
    }
    return token;
  } catch (e) {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
}

// ================= Estrazione squadre =================
//
// Modalità alternativa alla lobby manuale: si entra con solo il nome, e
// quando la stanza è piena (4 nomi) parte da sola, per tutti in
// contemporanea (via Firebase), una sequenza di 3 passaggi:
//  1. sorteggio delle coppie (chi gioca con chi)
//  2. la coppia sceglie l'accoppiata di colori (Rosso+Giallo o Verde+Blu) —
//     chi clicca per primo se la aggiudica
//  3. ciascuno sceglie il proprio colore tra i due della propria squadra
// Al termine, i colori finali vengono scritti in state.players esattamente
// come nella modalità manuale, quindi da lì in poi il resto del gioco
// (tabellone, mano, ecc.) non sa nemmeno che è stata usata un'estrazione.

function renderDraftNameScreen(roomId) {
  const root = $("#app");
  root.innerHTML = "";
  const nameInput = el("input", { id: "name-input", placeholder: "il tuo nome", value: myName || "" });
  root.appendChild(
    el(
      "div",
      { class: "lobby-card" },
      el("h1", {}, "Tock"),
      el("p", { class: "muted" }, `Stanza ${roomId} — modalità estrazione a sorte: qui non scegli il colore, solo il nome.`),
      nameInput,
      el("button", { id: "join-btn", class: "primary", onclick: () => joinDraftRoom(roomId) }, "Entra nella stanza", forwardArrowIcon()),
      el("button", { class: "text-link-btn", style: "margin-top:10px;", onclick: renderLobby }, backChevronIcon(), "Cambia stanza"),
      homeScreenHint()
    )
  );
}

async function joinDraftRoom(roomId) {
  unlockAudio();
  const name = $("#name-input").value.trim();
  if (!name) return showToast("Inserisci il tuo nome.");
  myRoomId = roomId;
  myName = name;
  myToken = getOrCreateRoomToken(roomId);

  // Un'UNICA transazione atomica (leggi-controlla-scrivi), non più un
  // get() separato seguito da un set()/updateState(): quel prima/dopo
  // lasciava una finestra in cui la stanza poteva risultare "esistente"
  // al get() iniziale ma "non ancora in cache" un istante dopo dentro la
  // transazione (tipico subito dopo essere entrati, prima che un
  // ascoltatore stabile l'abbia letta) — capitava un falso "questa stanza
  // non esiste più" anche su una stanza appena creata. Qui, come già in
  // joinManualRoom, `current === null` non è trattato come un errore: si
  // prova a creare la stanza da zero, e se in realtà esisteva già (solo
  // non in cache), Firebase stesso rifiuta il tentativo e ripete la
  // callback con lo stato vero — nessuna finestra di corsa critica.
  const ref = roomRef(roomId);
  let blockedReason = null; // "wrongMode" | "full" | "nameTaken" | null
  let caughtError = null;
  const result = await ref
    .transaction((current) => {
      blockedReason = null;
      try {
        if (current === null) {
          const state = newGameState({}, "draw");
          state.draft.players[myToken] = myName;
          state.draft.order.push(myToken);
          return state;
        }
        const state = normalizeState(JSON.parse(JSON.stringify(current)));
        if (state.roomMode !== "draw") {
          blockedReason = "wrongMode";
          return undefined;
        }
        if (!state.draft.players[myToken] && Object.keys(state.draft.players).length >= 4) {
          blockedReason = "full";
          return undefined;
        }
        // Due giocatori con lo stesso nome mandano in confusione il
        // rientro-per-nome più avanti (non saprebbe a chi dei due
        // restituire il posto), quindi lo blocchiamo già qui.
        const nameTaken = Object.entries(state.draft.players).some(
          ([tok, n]) => tok !== myToken && n && n.trim().toLowerCase() === myName.trim().toLowerCase()
        );
        if (nameTaken) {
          blockedReason = "nameTaken";
          return undefined;
        }
        if (!state.draft.players[myToken]) state.draft.order.push(myToken);
        state.draft.players[myToken] = myName;
        maybeStartPairDraw(state);
        return state;
      } catch (e) {
        caughtError = e;
        return undefined;
      }
    })
    .catch((e) => {
      caughtError = e;
      return null;
    });

  if (blockedReason === "wrongMode") {
    const snap = await ref.get().catch(() => null);
    const existing = snap && snap.val() ? normalizeState(snap.val()) : null;
    showToast("Questa stanza è già in modalità manuale — scegli il colore.");
    renderManualLobby(roomId, (existing && existing.players) || {});
    return;
  }
  if (blockedReason === "full") {
    showToast("Non è entrato: la stanza è già piena (4 giocatori).");
    return;
  }
  if (blockedReason === "nameTaken") {
    showToast(`"${myName}" è già stato usato da un altro giocatore in questa stanza. Scegli un nome diverso (es. aggiungi un'iniziale).`);
    return;
  }
  if (caughtError) {
    showToast("Non è entrato: " + describeError(caughtError));
    console.error(caughtError);
    return;
  }
  if (result && result.committed === false) {
    showToast("Non è entrato: richiesta non completata. Riprova.");
    return;
  }

  draftAnimShown.pairDraw = false;
  watchRoom(roomId, onDraftStateChange);
}

function onDraftStateChange(state) {
  if (!state) return;

  // Se il mio colore finale è già stato assegnato, l'estrazione è
  // conclusa: passo alla normale schermata di gioco, esattamente come la
  // modalità manuale.
  const myColorFound = COLORS.find((c) => state.players[c] && state.players[c].token === myToken);
  if (myColorFound) {
    myColor = myColorFound;
    // Così un eventuale ricollegamento futuro passa dal normale
    // meccanismo per-colore, condiviso con la modalità manuale.
    try { localStorage.setItem("tock-claim-" + myRoomId + "-" + myColor, myToken); } catch (e) {}
    // IMPORTANTE: costruisco la shell di gioco PRIMA di agganciare il
    // listener Firebase e prima di chiamare onStateChange a mano. Prima
    // l'ordine era invertito (watchRoom veniva attaccato prima di
    // renderGameShell): se il listener richiamava onStateChange in modo
    // sincrono (o comunque prima che renderGameShell fosse eseguita),
    // la schermata di rivelazione del mazziere veniva creata e inserita
    // in #app, e SUBITO DOPO renderGameShell() azzerava #app con
    // innerHTML="" cancellandola — ma dealerDrawAnimShown risultava già
    // marcato per questa stanza, quindi il richiamo successivo (quello nel
    // requestAnimationFrame qui sotto) veniva bloccato dalla guardia e non
    // la ricreava più. Risultato: il toast di riserva compariva (era stato
    // mostrato durante la prima chiamata, prima della cancellazione) ma il
    // riquadro dell'estrazione no. Costruendo prima la shell, qualunque
    // chiamata a onStateChange (dal listener o dal nostro rAF) trova #app
    // già pronta e non rischia più di essere spazzata via.
    renderGameShell();
    roomRef(myRoomId).off("value");
    watchRoom(myRoomId, onStateChange);
    // Non aspetta il prossimo giro del listener Firebase per mostrare la
    // schermata di gioco vera e propria (mano già distribuita, rivelazione
    // del mazziere inclusa, vedi dealAndRevealDealer): lo stato lo abbiamo
    // già qui, quindi lo disegniamo subito — stesso principio "non
    // dipendere da un secondo giro" già applicato altrove in questa
    // sessione, invece di fidarsi ciecamente del fatto che il listener
    // appena riattaccato richiami onStateChange in tempo utile da solo.
    //
    // Un frame di ritardo (requestAnimationFrame) apposta: anche se ora
    // #app è già stata ricostruita da renderGameShell() qui sopra, il
    // frame appena dopo lascia comunque al browser il tempo di "vedere" lo
    // stato iniziale del nuovo albero DOM prima di far partire eventuali
    // animazioni CSS di comparsa, invece di crearle e animarle nello stesso
    // istante sincrono in cui sono state inserite.
    requestAnimationFrame(() => onStateChange(state));
    return;
  }

  maybeAdvanceDraft(state);
  maybeAdvanceDraftBots(state);
  renderDraftScreen(state);
}

// Estrae il sorteggio delle coppie non appena il 4° posto si riempie.
// Va chiamata DIRETTAMENTE dentro la stessa transazione che scrive il 4°
// giocatore (join di una persona, o aggiunta dell'ultimo bot) — non solo
// da maybeAdvanceDraft in risposta al listener "value" — così la stanza
// passa al sorteggio in modo atomico, senza dover contare su un secondo
// giro di scrittura innescato dopo il fatto: se per qualsiasi motivo quel
// secondo giro tardasse o non scattasse, la stanza restava bloccata a
// "in attesa" anche con 4/4 giocatori già presenti.
function maybeStartPairDraw(state) {
  const d = state.draft;
  if (!d || d.pairDraw) return;
  if (Object.keys(d.players).length !== 4) return;
  const tokens = d.order.filter((t) => d.players[t]).slice(0, 4);
  const shuffled = shuffle(tokens);
  d.pairDraw = { pairs: [[shuffled[0], shuffled[1]], [shuffled[2], shuffled[3]]] };
}

// Fa avanzare l'estrazione da uno stato all'altro. È chiamata da tutti e 4
// i client ogni volta che lo stato cambia, ma ogni passaggio è protetto da
// un controllo dentro la transazione Firebase, quindi anche se più client
// la eseguono nello stesso istante il risultato viene scritto una volta
// sola (gli altri tentativi diventano no-op). Resta come rete di sicurezza
// oltre a maybeStartPairDraw (es. se il 4° giocatore fosse entrato prima
// di questo aggiornamento del codice, o in un caso limite non coperto).
function maybeAdvanceDraft(state) {
  const d = state.draft;
  if (!d) return;

  if (Object.keys(d.players).length === 4 && !d.pairDraw) {
    updateState(myRoomId, (s) => {
      maybeStartPairDraw(s);
    }).catch(() => {});
    return;
  }

  if (d.pairDraw && Object.keys(d.colorPicks).length === 4 && Object.keys(state.players).length < 4) {
    updateState(myRoomId, (s) => {
      maybeFinalizeDraft(s);
    }).catch(() => {});
  }
}

// Anche questa, come maybeStartPairDraw/assignBotPairColors, va richiamata
// direttamente dentro la stessa transazione che porta colorPicks a 4 (vedi
// pickSoloColor e pickColorPair) e non solo dal giro di sicurezza qui sopra
// innescato dal listener.
function maybeFinalizeDraft(state) {
  const d = state.draft;
  if (!d) return;
  if (Object.keys(state.players).length >= 4) return; // già finalizzato
  if (Object.keys(d.colorPicks).length < 4) return;
  for (const [token, color] of Object.entries(d.colorPicks)) {
    const botLevel = d.botTokens && d.botTokens[token];
    state.players[color] = botLevel
      ? { name: d.players[token], token, isBot: true, botLevel }
      : { name: d.players[token], token };
  }
  // A differenza della modalità manuale (dove tutti scelgono il proprio
  // colore da soli e quindi c'è sempre qualcuno pronto a cliccare "Inizia
  // partita"), qui l'estrazione è già di per sé l'azione che l'unica
  // persona presente ha compiuto: non ha senso rimandarla a un secondo
  // click su un pulsante che potrebbe non essere ovvio da trovare. Si
  // distribuisce quindi subito la prima mano (vedi la nota su
  // dealAndRevealDealer per perché non si aspetta più l'animazione).
  dealAndRevealDealer(state);
}

// Determina il mazziere e distribuisce subito la prima mano, invece di
// limitarsi a impostare la fase "dealerDraw" e ASPETTARE che l'animazione
// lato client (fino a ~30s: pesca carte finché non esce l'Asso di Cuori)
// finisca per davvero distribuire — quell'attesa dipendeva da un SOLO
// client che restasse in primo piano per tutta la sua durata, esattamente
// il tipo di punto debole già visto e corretto altrove in questa sessione
// (se quel client si bloccava, andava in background o si ricaricava a
// metà, la partita restava bloccata per sempre su "in attesa"). Il
// risultato dell'estrazione è comunque deterministico e calcolato subito
// (buildDealerDrawSequence), quindi non c'è motivo di farlo dipendere da
// un'animazione: la sequenza resta salvata in state.dealerDraw SOLO per
// essere mostrata come effetto scenico da ogni client (vedi
// renderDealerDrawScreen), ma il gioco vero e proprio (fase, mazziere,
// carte in mano) è già pronto anche se nessuno la vede fino alla fine.
function dealAndRevealDealer(state) {
  const draw = buildDealerDrawSequence();
  state.dealerDraw = draw;
  state.dealerColor = draw.winnerColor;
  dealNewHand(state); // porta la fase a "exchanging" e distribuisce le carte
}

// Se una coppia estratta è composta da DUE bot, nessun client umano
// cliccherà mai "scegli il colore" per loro (pickColorPair/pickSoloColor
// sono pensati per una persona che clicca sulla propria squadra) — la
// scelta della squadra normale, quando almeno uno dei due è umano, resta
// invariata: il partner umano che clicca assegna automaticamente anche il
// colore del compagno bot (vedi pickSoloColor). Qui si copre solo il caso
// in cui NESSUNO dei due può farlo da sé: un bot decide al posto della
// coppia, dopo una piccola pausa "umana", con lo stesso schema idempotente
// (transazione Firebase) usato per le mosse dei bot in partita.
let draftBotTimer = null;
function scheduleDraftBotAction(fn) {
  if (draftBotTimer) return;
  const delay = 900 + Math.random() * 900; // 0,9s – 1,8s
  draftBotTimer = setTimeout(() => {
    draftBotTimer = null;
    fn().catch((e) => console.error("bot estrazione:", e));
  }, delay);
}

function maybeAdvanceDraftBots(state) {
  const d = state.draft;
  if (!d || !d.pairDraw || !d.pairChoice) return;
  if (Object.keys(d.colorPicks).length >= 4) return;
  const botTokens = d.botTokens || {};
  for (let pairIndex = 0; pairIndex < 2; pairIndex++) {
    const pair = d.pairDraw.pairs[pairIndex];
    if (!pair || !pair.every((t) => botTokens[t])) continue; // almeno un umano: ci pensa lui/lei
    if (pair.some((t) => d.colorPicks[t])) continue; // già assegnato
    scheduleDraftBotAction(() => botPickPairColors(pairIndex));
    return;
  }
}

// Logica pura (nessuna transazione propria) così può essere richiamata sia
// da botPickPairColors (giro separato, rete di sicurezza) sia direttamente
// dentro la transazione di pickColorPair — vedi lì per il perché.
function assignBotPairColors(state, pairIndex) {
  const d = state.draft;
  if (!d || !d.pairDraw || !d.pairChoice) return;
  const pair = d.pairDraw.pairs[pairIndex];
  if (!pair) return;
  if (pair.some((t) => d.colorPicks[t])) return; // già deciso
  const { pickIndex, pick } = d.pairChoice;
  const myPick = pairIndex === pickIndex ? pick : (pick === "RY" ? "GB" : "RY");
  const options = myPick === "RY" ? ["red", "yellow"] : ["green", "blue"];
  const color = options[Math.floor(Math.random() * 2)];
  const otherColor = options.find((c) => c !== color);
  d.colorPicks[pair[0]] = color;
  d.colorPicks[pair[1]] = otherColor;
}

async function botPickPairColors(pairIndex) {
  await updateState(myRoomId, (state) => {
    assignBotPairColors(state, pairIndex);
    maybeFinalizeDraft(state);
  });
}

function renderDraftScreen(state) {
  const d = state.draft;

  if (!d.colorPicks[myToken]) return renderSoloColorChoice(state);
  return renderDraftFinalizing(state);

function showDraftSlotsInstant(pairA, pairB, nameOf) {
  const set = (id, text) => {
    const s = document.getElementById(id);
    if (s) s.querySelector("span").textContent = text;
  };
  set("draft-slot-a1", nameOf(pairA[0]));
  set("draft-slot-a2", nameOf(pairA[1]));
  set("draft-slot-b1", nameOf(pairB[0]));
  set("draft-slot-b2", nameOf(pairB[1]));
  const ta = document.getElementById("draft-team-a");
  const tb = document.getElementById("draft-team-b");
  if (ta) ta.classList.add("ready");
  if (tb) tb.classList.add("ready");
}

async function animateDraftSlots(pairA, pairB, nameOf, renderToken) {
  const pool = [nameOf(pairA[0]), nameOf(pairA[1]), nameOf(pairB[0]), nameOf(pairB[1])];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const stale = () => renderToken !== draftPairRenderToken;
  const spin = async (id, finalText, staggerMs) => {
    await sleep(staggerMs);
    if (stale()) return;
    const slotEl = document.getElementById(id);
    if (!slotEl) return;
    const span = slotEl.querySelector("span");
    slotEl.classList.add("spinning");
    const start = Date.now();
    while (Date.now() - start < 650) {
      if (stale()) return;
      span.textContent = pool[Math.floor(Math.random() * pool.length)];
      await sleep(55);
    }
    if (stale()) return;
    span.textContent = finalText;
    slotEl.classList.remove("spinning");
  };
  await Promise.all([
    spin("draft-slot-a1", nameOf(pairA[0]), 0),
    spin("draft-slot-a2", nameOf(pairA[1]), 200),
    spin("draft-slot-b1", nameOf(pairB[0]), 400),
    spin("draft-slot-b2", nameOf(pairB[1]), 600),
  ]);
  if (stale()) return;
  const ta = document.getElementById("draft-team-a");
  const tb = document.getElementById("draft-team-b");
  if (ta) ta.classList.add("ready");
  if (tb) tb.classList.add("ready");
  await sleep(150);
}

async function pickColorPair(pairIndex, pick) {
  try {
    await updateState(myRoomId, (state) => {
      if (state.draft.pairChoice) return; // già deciso da qualcun altro
      state.draft.pairChoice = { pickIndex: pairIndex, pick };
      // Se l'altra coppia è composta da soli bot, nessun umano cliccherà
      // mai per lei: le assegniamo subito i colori qui, nella stessa
      // scrittura che fissa la scelta — invece di aspettare un giro
      // separato (maybeAdvanceDraftBots/botPickPairColors) innescato dal
      // listener, che ha già mostrato di non essere sempre affidabile.
      const botTokens = state.draft.botTokens || {};
      const otherPairIndex = pairIndex === 0 ? 1 : 0;
      const otherPair = state.draft.pairDraw.pairs[otherPairIndex];
      if (otherPair && otherPair.every((t) => botTokens[t])) {
        assignBotPairColors(state, otherPairIndex);
      }
      maybeFinalizeDraft(state);
    });
  } catch (e) {
    console.error(e);
  }
}

function renderSoloColorChoice(state) {
  const root = $("#app");
  root.innerHTML = "";
  const [pairA, pairB] = state.draft.pairDraw.pairs;
  const myPairIndex = pairA.includes(myToken) ? 0 : 1;
  const { pickIndex, pick } = state.draft.pairChoice;
  const myPick = myPairIndex === pickIndex ? pick : (pick === "RY" ? "GB" : "RY");
  const options = myPick === "RY" ? ["red", "yellow"] : ["green", "blue"];
  const taken = new Set(Object.values(state.draft.colorPicks));

  root.appendChild(
    el(
      "div",
      { class: "lobby-card" },
      el("h1", {}, "Tock"),
      el("p", { class: "muted" }, `La tua squadra ha preso ${myPick === "RY" ? "Rosso + Giallo" : "Verde + Blu"}. Tu quale vuoi?`),
      el(
        "div",
        { class: "solo-choice" },
        options.map((c) =>
          el(
            "button",
            { class: "solo-btn color-" + c, disabled: taken.has(c), onclick: () => pickSoloColor(c) },
            colorLabel(c) + (taken.has(c) ? " (preso)" : "")
          )
        )
      )
    )
  );
}

async function pickSoloColor(color) {
  try {
    await updateState(myRoomId, (state) => {
      if (state.draft.colorPicks[myToken]) return; // già scelto
      if (Object.values(state.draft.colorPicks).includes(color)) throw new Error("colore già preso dal tuo compagno");
      const [pairA, pairB] = state.draft.pairDraw.pairs;
      const myPair = pairA.includes(myToken) ? pairA : pairB;
      const partnerToken = myPair.find((t) => t !== myToken);
      const myPairIndex = pairA.includes(myToken) ? 0 : 1;
      const { pickIndex, pick } = state.draft.pairChoice;
      const myPick = myPairIndex === pickIndex ? pick : (pick === "RY" ? "GB" : "RY");
      const options = myPick === "RY" ? ["red", "yellow"] : ["green", "blue"];
      const otherColor = options.find((c) => c !== color);
      state.draft.colorPicks[myToken] = color;
      // Al compagno di squadra resta un solo colore possibile (quello che
      // non hai preso tu): glielo assegniamo subito in automatico, così non
      // deve cliccare anche lui/lei per confermarlo.
      if (partnerToken && !state.draft.colorPicks[partnerToken]) {
        state.draft.colorPicks[partnerToken] = otherColor;
      }
      maybeFinalizeDraft(state);
    });
  } catch (e) {
    showToast(describeError(e));
  }
}

function renderDraftFinalizing(state) {
  const root = $("#app");
  root.innerHTML = "";
  // Mostra chi manca ancora, invece di un generico "in corso": se qualcuno
  // ha chiuso la pagina a metà (es. un test con una scheda abbandonata), qui
  // si vede subito chi è bloccato, invece di restare senza informazioni.
  const d = state.draft;
  const doneTokens = Object.keys(d.colorPicks);
  const waitingNames = d.order
    .filter((t) => d.players[t] && !doneTokens.includes(t))
    .map((t) => d.players[t]);
  root.appendChild(
    el(
      "div",
      { class: "lobby-card" },
      el("h1", {}, "Tock"),
      el("p", { class: "muted" }, "Tu sei pronto! Avvio in corso..."),
      waitingNames.length > 0
        ? el("p", { class: "muted" }, `In attesa che scelga il colore: ${waitingNames.join(", ")}.`)
        : el("p", { class: "muted" }, "Anche gli altri sono pronti, avvio imminente...")
    )
  );
}
